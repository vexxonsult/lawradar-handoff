name: Moteur LawRadar — livraison structurée

on:
  workflow_dispatch:
  schedule:
    # 17:35 Europe/Paris en heure d'été, après la collecte de 17:20.
    - cron: "35 15 * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: moteur-lawradar
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.delta.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
      - id: delta
        name: Lire le delta avant tout appel au modèle
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          delta = json.loads(Path("evidence/delta-latest.json").read_text(encoding="utf-8"))
          required = delta.get("model_input_required") is True
          Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8").write(f"should_run={'true' if required else 'false'}\n")
          print(f"model_input_required={required}")
          PY

  moteur:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vérifier les règles de rendu
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Produire la livraison structurée
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: >-
            Tu exécutes le moteur LawRadar. Lis d'abord config/moteur-contract.md,
            config/moteur-delivery-schema.json et evidence/delta-latest.json, puis
            seulement les fichiers de preuve explicitement signalés comme CHANGED
            ou NEW dans le delta. N'utilise ni réseau ni recherche externe. Écris
            exactement out/motor-delivery.json, conforme au schéma. N'écris aucun
            autre fichier et ne modifie jamais les preuves. Une information non
            démontrée reste UNRESOLVED ; une source inaccessible ne signifie jamais
            qu'il n'y a rien. Si aucun flux n'est étayé, écris money_flows: [].
          claude_args: >-
            --model claude-sonnet-5
            --max-turns 5
            --allowedTools Read,Write
      - name: Valider et rendre le dashboard
        run: python scripts/render_motor_delivery.py --input out/motor-delivery.json --dashboard out/dashboard.html
      - name: Publier la livraison privée du run
        uses: actions/upload-artifact@v4
        with:
          name: lawradar-moteur-${{ github.run_id }}
          path: out/
          retention-days: 90
