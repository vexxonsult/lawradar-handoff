name: Moteur LawRadar — livraison structurée

on:
  workflow_dispatch:
  schedule:
    # 17:35 Europe/Paris en heure d'été, après la collecte de 17:20.
    - cron: "35 15 * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: moteur-lawradar
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.delta.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: delta
        name: Préparer le diff et éviter tout appel inutile au modèle
        run: |
          mkdir -p out
          python scripts/prepare_motor_input.py --output out/motor-input-gate.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          prepared = json.loads(Path("out/motor-input-gate.json").read_text(encoding="utf-8"))
          required = bool(prepared.get("candidates"))
          Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8").write(f"should_run={'true' if required else 'false'}\n")
          print(f"model_input_required={required}; candidates={len(prepared.get('candidates', []))}")
          PY

  moteur:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Démarrer la mesure du run
        run: echo "LAWRADAR_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vérifier les règles de rendu
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Préparer la livraison du run
        run: |
          mkdir -p out
          python scripts/prepare_motor_input.py --output out/motor-input.json
      - name: Produire la livraison structurée
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: >-
            Tu exécutes le moteur LawRadar. Lis uniquement out/motor-input.json et
            config/moteur-delivery-schema.json. N'utilise ni réseau, ni recherche,
            ni Google Drive, ni autres fichiers. Écris exactement out/motor-delivery.json, conforme
            au schéma. N'écris aucun autre fichier. Chaque candidate doit avoir une
            opportunity avec son source_id ; toute information non démontrée est
            UNRESOLVED. Si aucun flux n'est étayé, écris money_flows: [].
          claude_args: >-
            --model claude-sonnet-5
            --max-turns 5
            --allowedTools Read,Write
      - name: Valider et rendre le dashboard
        run: python scripts/render_motor_delivery.py --input out/motor-delivery.json --dashboard out/dashboard.html
      - name: Publier la livraison du run
        env:
          LAWRADAR_MODEL: claude-sonnet-5
        run: >-
          python scripts/build_run_manifest.py
          --output out/run-manifest.json
          --kind motor --status success
          --inputs out/motor-input.json config/moteur-delivery-schema.json
          --outputs out/motor-delivery.json out/dashboard.html
      - name: Téléverser la livraison du run
        uses: actions/upload-artifact@v4
        with:
          name: lawradar-moteur-${{ github.run_id }}
          path: out/
          retention-days: 90
