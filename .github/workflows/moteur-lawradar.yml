name: Moteur LawRadar — livraison structurée

on:
  workflow_dispatch:
    inputs:
      clients_only:
        description: "Rejouer Presse, Demande et Marché sur le dernier dossier universel, sans lancer le moteur"
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows: ["Collecte primaire DILA JORF"]
    types: [completed]
  schedule:
    # Pige Batch toutes les vingt minutes. La porte locale interdit toute
    # requête Anthropic en l'absence de candidats ou de batch actif.
    - cron: "9,29,49 5-16 * * *"
      timezone: "Europe/Paris"
    # Consolidation BOAMP et rattrapage du soir, stables en CET comme en CEST.
    - cron: "17 17 * * *"
      timezone: "Europe/Paris"
    - cron: "17 18 * * *"
      timezone: "Europe/Paris"
    - cron: "17 19 * * *"
      timezone: "Europe/Paris"

permissions:
  contents: write
  id-token: write

concurrency:
  # All workflows that can publish a mutable ``evidence/*-latest.json`` share
  # this repository-wide writer lock. Read-only client branches remain local
  # jobs of this workflow and do not open a competing Git transaction.
  group: lawradar-evidence-writer
  cancel-in-progress: false

jobs:
  gate:
    if: github.event.inputs.clients_only != 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.delta.outputs.should_run }}
      skip_reason: ${{ steps.delta.outputs.skip_reason }}
      quiet_idle: ${{ steps.delta.outputs.quiet_idle }}
      queue_changed: ${{ steps.delta.outputs.queue_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: delta
        name: Préparer le diff et éviter tout appel inutile au modèle
        env:
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
        run: |
          mkdir -p out
          python scripts/manage_motor_queue.py stage --queue evidence/motor-queue-latest.json --queue-output out/motor-queue-proposed.json --batch-output out/motor-input-gate.json --batch-size 250 --active-batch-state evidence/motor-batch-latest.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          prepared = json.loads(Path("out/motor-input-gate.json").read_text(encoding="utf-8"))
          required = bool(prepared.get("candidates"))
          changed = set(prepared.get("delta_changed_sources", []))
          handled = set(prepared.get("handled_source_files", []))
          unsupported = sorted(changed - handled)
          if required:
              reason = "CANDIDATES_READY"
          elif prepared.get("excluded_historical_candidates"):
              reason = f"{len(prepared['excluded_historical_candidates'])} réapparition(s) historique(s) hors fenêtre quotidienne, non envoyée(s) au moteur."
          elif prepared.get("excluded_routine_candidates"):
              reason = f"{len(prepared['excluded_routine_candidates'])} publication(s) de routine administrative, classée(s) sans appel au moteur."
          elif prepared.get("deterministically_unresolved_candidates"):
              reason = f"{len(prepared['deterministically_unresolved_candidates'])} texte(s) officiel(s) sans contenu exploitable, classé(s) UNRESOLVED sans appel au moteur."
          elif unsupported == ["eurlex-oj-latest.json"]:
              reason = "Variation EUR-Lex détectée ; hors périmètre du moteur actuel (JORF et ConsultDD)."
          elif unsupported:
              reason = "Variation détectée sur une source hors périmètre du moteur actuel."
          else:
              reason = "Aucun candidat JORF ou ConsultDD à interpréter."
          queue_path = Path("evidence/motor-queue-latest.json")
          proposed_path = Path("out/motor-queue-proposed.json")
          queue_changed = not queue_path.exists() or queue_path.read_bytes() != proposed_path.read_bytes()
          quiet_idle = not required and os.environ.get("TRIGGER_SCHEDULE") == "9,29,49 5-16 * * *"
          Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8").write(
              f"should_run={'true' if required else 'false'}\n"
              f"skip_reason={reason}\n"
              f"quiet_idle={'true' if quiet_idle else 'false'}\n"
              f"queue_changed={'true' if queue_changed else 'false'}\n"
          )
          print(f"model_input_required={required}; candidates={len(prepared.get('candidates', []))}; quiet_idle={quiet_idle}")
          PY
      # La file est persistée par le job moteur, dans la même transaction que
      # son batch ou sa livraison. Écrire ici depuis un second job créait une
      # course avec la clôture du moteur et pouvait provoquer un conflit Git.

  record_skipped:
    needs: gate
    if: github.event.inputs.clients_only != 'true' && needs.gate.outputs.should_run != 'true' && needs.gate.outputs.quiet_idle != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Démarrer la mesure du run
        run: echo "LAWRADAR_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: archive_skipped
        name: Enregistrer l'absence d'appel au modèle et la calibration
        env:
          SKIP_REASON: ${{ needs.gate.outputs.skip_reason }}
        run: |
          mkdir -p out
          python scripts/manage_motor_queue.py stage --queue evidence/motor-queue-latest.json --queue-output out/motor-queue-proposed.json --batch-output out/motor-input-skipped.json --batch-size 250 --active-batch-state evidence/motor-batch-latest.json
          python scripts/utils/recycle_backlog.py recycle \
            --backlog evidence/recycle-backlog-latest.json \
            --policy config/compliance-policy-v1.json \
            --profile config/operator-profile-v1.json \
            --output evidence/recycle-backlog-latest.json \
            --ready-output out/recycle-ready.json
          python scripts/build_run_manifest.py --output evidence/run-manifest-motor-latest.json --kind motor --status skipped --reason "$SKIP_REASON" --inputs evidence/delta-latest.json evidence/jorf-summaries-latest.json evidence/consultdd-latest.json out/motor-input-skipped.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          motor_input = json.loads(Path("out/motor-input-skipped.json").read_text(encoding="utf-8"))
          delivery = {
              "schema": "lawradar-motor-delivery-v1",
              "run": {
                  "report_date": motor_input["report_date"],
                  "coverage": "0 candidat envoyé au modèle",
                  "summary": os.environ["SKIP_REASON"],
              },
              "opportunities": [],
              "money_flows": [],
          }
          Path("out/motor-delivery-skipped.json").write_text(
              json.dumps(delivery, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          python scripts/build_universal_signal.py \
            --motor-input out/motor-input-skipped.json \
            --delivery out/motor-delivery-skipped.json \
            --run-manifest evidence/run-manifest-motor-latest.json \
            --output out/universal-signal-skipped.json
          python scripts/archive_universal_signal.py \
            --dossier out/universal-signal-skipped.json \
            --archive-root evidence/universal-signals \
            --archive-only \
            --manifest out/universal-signal-archive-skipped.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          manifest = json.loads(Path("out/universal-signal-archive-skipped.json").read_text(encoding="utf-8"))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"archive_path={manifest['archive_path']}\n")
              output.write(f"durable_manifest_path={manifest['durable_manifest_path']}\n")
          PY
          python scripts/build_run_manifest.py --output evidence/run-manifest-motor-latest.json --kind motor --status skipped --reason "$SKIP_REASON" --inputs evidence/delta-latest.json evidence/jorf-summaries-latest.json evidence/consultdd-latest.json out/motor-input-skipped.json --outputs out/universal-signal-skipped.json out/universal-signal-archive-skipped.json
          python scripts/build_run_index.py --output evidence/run-index-latest.json --manifests evidence/run-manifest-latest.json evidence/run-manifest-motor-latest.json
          python scripts/render_control_dashboard.py --input evidence/run-index-latest.json --backlog evidence/motor-backlog-latest.json --out out/control-dashboard.html
      - name: Téléverser le contrôle du run ignoré
        uses: actions/upload-artifact@v4
        with:
          name: lawradar-motor-${{ github.run_id }}
          path: |
            evidence/run-manifest-motor-latest.json
            evidence/run-index-latest.json
            out/control-dashboard.html
            out/motor-input-skipped.json
            out/universal-signal-skipped.json
            out/universal-signal-archive-skipped.json
            out/recycle-ready.json
          retention-days: 90
      - name: Versionner le statut ignoré du moteur
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "lawradar-motor[bot]"
          git config user.email "lawradar-motor[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # La file proposée inclut les textes marqués PRIMARY_TEXT_EMPTY.
          # Les persister ici évite de les oublier pendant un run sans IA.
          cp out/motor-queue-proposed.json evidence/motor-queue-latest.json
          git add -- evidence/motor-queue-latest.json evidence/recycle-backlog-latest.json evidence/run-manifest-motor-latest.json evidence/run-index-latest.json "${{ steps.archive_skipped.outputs.archive_path }}" "${{ steps.archive_skipped.outputs.durable_manifest_path }}"
          git diff --cached --quiet || git commit -m "Moteur LawRadar ignoré $(date -u +%F)"
          git pull --rebase origin main
          git push

  moteur:
    needs: gate
    if: github.event.inputs.clients_only != 'true' && needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      batch_ready: ${{ steps.batch.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Démarrer la mesure du run
        run: echo "LAWRADAR_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vérifier les règles de rendu
        run: python -m unittest discover -s tests -p 'test_*.py'
      - id: batch_auth
        name: Vérifier la clé API Batch sans l'exposer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "ANTHROPIC_API_KEY absente : aucun appel Anthropic ne sera lancé."
          fi
      - name: Installer le SDK officiel Anthropic
        if: steps.batch_auth.outputs.configured == 'true'
        run: python -m pip install --disable-pip-version-check "anthropic>=1.0,<2"
      - name: Préparer la livraison du run
        run: |
          mkdir -p out
          python scripts/manage_motor_queue.py stage --queue evidence/motor-queue-latest.json --queue-output out/motor-queue-proposed.json --batch-output out/motor-input.json --batch-size 250 --active-batch-state evidence/motor-batch-latest.json
      - id: batch
        name: Soumettre ou reprendre le Message Batch Anthropic
        if: steps.batch_auth.outputs.configured == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # Le batch est asynchrone : écrire/commiter son identifiant tout de
        # suite réduit la fenêtre où un arrêt de runner pourrait perdre la
        # référence fournisseur. Les piges suivantes font la moisson.
        run: |
          python scripts/run_anthropic_motor_batch.py \
            --input out/motor-input.json \
            --state evidence/motor-batch-latest.json \
            --output out/motor-delivery.json \
            --resolved-input-output out/motor-input-resolved.json \
            --model claude-sonnet-5 \
            --wait-seconds 0 \
            --poll-seconds 10
      - name: Enregistrer la migration en attente de clé API
        if: steps.batch_auth.outputs.configured != 'true'
        run: |
          python scripts/build_run_manifest.py --output evidence/run-manifest-motor-latest.json --kind motor --status skipped --reason "ANTHROPIC_API_KEY absente ; migration Batch prête mais aucun appel fournisseur lancé." --inputs out/motor-input.json
          python scripts/build_run_index.py --output evidence/run-index-latest.json --manifests evidence/run-manifest-latest.json evidence/run-manifest-motor-latest.json
          python scripts/render_control_dashboard.py --input evidence/run-index-latest.json --backlog evidence/motor-backlog-latest.json --out out/control-dashboard.html
      - name: Téléverser le contrôle sans appel fournisseur
        if: steps.batch_auth.outputs.configured != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lawradar-motor-${{ github.run_id }}
          path: |
            evidence/run-manifest-motor-latest.json
            evidence/run-index-latest.json
            out/control-dashboard.html
          retention-days: 90
      - name: Versionner le blocage de configuration sans erreur de run
        if: steps.batch_auth.outputs.configured != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "lawradar-motor[bot]"
          git config user.email "lawradar-motor[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          cp out/motor-queue-proposed.json evidence/motor-queue-latest.json
          git add evidence/motor-queue-latest.json evidence/run-manifest-motor-latest.json evidence/run-index-latest.json
          git diff --cached --quiet || git commit -m "Moteur LawRadar sans clé Batch $(date -u +%F)"
          git pull --rebase origin main
          git push
      - name: Enregistrer le batch asynchrone en cours
        if: steps.batch_auth.outputs.configured == 'true' && steps.batch.outputs.ready != 'true' && steps.batch.outputs.processing_status != 'ended'
        run: |
          # L'état fournisseur et la file préparée sont conservés ensemble :
          # le prochain réveil reprend exactement le même lot, même si de
          # nouveaux textes arrivent entre-temps.
          cp out/motor-queue-proposed.json evidence/motor-queue-latest.json
          python scripts/build_run_manifest.py --output evidence/run-manifest-motor-latest.json --kind motor --status pending --reason "Message Batch Anthropic en cours ; reprise sans nouvelle soumission au prochain run." --inputs out/motor-input-resolved.json --outputs evidence/motor-batch-latest.json
          python scripts/build_run_index.py --output evidence/run-index-latest.json --manifests evidence/run-manifest-latest.json evidence/run-manifest-motor-latest.json
          python scripts/render_control_dashboard.py --input evidence/run-index-latest.json --backlog evidence/motor-backlog-latest.json --out out/control-dashboard.html
      - name: Téléverser l'état du batch encore en cours
        if: steps.batch_auth.outputs.configured == 'true' && steps.batch.outputs.ready != 'true' && steps.batch.outputs.processing_status != 'ended'
        uses: actions/upload-artifact@v4
        with:
          name: lawradar-motor-batch-${{ github.run_id }}
          path: |
            evidence/motor-batch-latest.json
            evidence/run-manifest-motor-latest.json
            evidence/run-index-latest.json
            out/control-dashboard.html
            out/motor-input-resolved.json
          retention-days: 90
      - name: Mémoriser le batch encore en cours sans le soumettre à nouveau
        if: steps.batch_auth.outputs.configured == 'true' && steps.batch.outputs.ready != 'true' && steps.batch.outputs.processing_status != 'ended'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "lawradar-motor[bot]"
          git config user.email "lawradar-motor[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add evidence/motor-batch-latest.json evidence/motor-queue-latest.json evidence/run-manifest-motor-latest.json evidence/run-index-latest.json
          git diff --cached --quiet || git commit -m "Batch moteur LawRadar en cours $(date -u +%F)"
          git pull --rebase origin main
          git push
      - name: Enregistrer un batch Anthropic refusé sans le rejouer
        if: steps.batch_auth.outputs.configured == 'true' && steps.batch.outputs.ready != 'true' && steps.batch.outputs.processing_status == 'ended'
        run: |
          cp out/motor-queue-proposed.json evidence/motor-queue-latest.json
          python scripts/build_run_manifest.py --output evidence/run-manifest-motor-latest.json --kind motor --status failed --reason "Message Batch Anthropic achevé sans livraison valide ; consulter evidence/motor-batch-latest.json avant tout rejeu." --inputs out/motor-input-resolved.json --outputs evidence/motor-batch-latest.json
          python scripts/build_run_index.py --output evidence/run-index-latest.json --manifests evidence/run-manifest-latest.json evidence/run-manifest-motor-latest.json
      - name: Mémoriser le diagnostic du batch refusé
        if: steps.batch_auth.outputs.configured == 'true' && steps.batch.outputs.ready != 'true' && steps.batch.outputs.processing_status == 'ended'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "lawradar-motor[bot]"
          git config user.email "lawradar-motor[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add evidence/motor-batch-latest.json evidence/motor-queue-latest.json evidence/run-manifest-motor-latest.json evidence/run-index-latest.json
          git diff --cached --quiet || git commit -m "Diagnostic batch moteur LawRadar $(date -u +%F)"
          git pull --rebase origin main
          git push
      - name: Valider et rendre le dashboard
        if: steps.batch.outputs.ready == 'true'
        run: python scripts/render_motor_delivery.py --input out/motor-delivery.json --dashboard out/dashboard.html
      - name: Publier la livraison du run
        if: steps.batch.outputs.ready == 'true'
        env:
          LAWRADAR_MODEL: claude-sonnet-5
        run: >-
          python scripts/build_run_manifest.py
          --output out/run-manifest.json
          --kind motor --status success
          --inputs out/motor-input-resolved.json config/moteur-delivery-schema.json
          --outputs out/motor-delivery.json out/dashboard.html
      - id: archive
        name: Construire et archiver le dossier universel de signal
        if: steps.batch.outputs.ready == 'true'
        run: |
          python scripts/build_universal_signal.py --motor-input out/motor-input-resolved.json --delivery out/motor-delivery.json --run-manifest out/run-manifest.json --output out/universal-signal.json
          # L'archive immuable est créée avant le pointeur latest. Si elle
          # échoue, la file ne bouge pas et aucun client ne reçoit l'ancien lot.
          python scripts/archive_universal_signal.py \
            --dossier out/universal-signal.json \
            --archive-root evidence/universal-signals \
            --latest evidence/universal-signal-latest.json \
            --manifest out/universal-signal-archive.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          manifest = json.loads(Path("out/universal-signal-archive.json").read_text(encoding="utf-8"))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"archive_path={manifest['archive_path']}\n")
              output.write(f"durable_manifest_path={manifest['durable_manifest_path']}\n")
          PY
          python scripts/build_agent_pilot_readiness.py --dossier out/universal-signal.json --policy config/compliance-policy-v1.json --profile config/operator-profile-v1.json --output out/agent-pilot-readiness.json
          cp out/agent-pilot-readiness.json evidence/agent-pilot-readiness-latest.json
          python scripts/utils/recycle_backlog.py capture \
            --dossier out/universal-signal.json \
            --queue evidence/motor-queue-latest.json \
            --policy config/compliance-policy-v1.json \
            --profile config/operator-profile-v1.json \
            --backlog evidence/recycle-backlog-latest.json \
            --output evidence/recycle-backlog-latest.json
          python scripts/utils/recycle_backlog.py recycle \
            --backlog evidence/recycle-backlog-latest.json \
            --policy config/compliance-policy-v1.json \
            --profile config/operator-profile-v1.json \
            --output evidence/recycle-backlog-latest.json \
            --ready-output out/recycle-ready.json
          python scripts/build_run_manifest.py --output out/run-manifest.json --kind motor --status success --inputs out/motor-input-resolved.json config/moteur-delivery-schema.json --outputs out/motor-delivery.json out/dashboard.html out/universal-signal.json out/universal-signal-archive.json out/agent-pilot-readiness.json
      - name: Actualiser le registre du centre de contrôle
        if: steps.batch.outputs.ready == 'true'
        run: |
          # On avance la file exactement telle qu'elle était au moment de la
          # soumission, plus les nouveaux candidats déjà vus par ce run.
          # Partir de l'ancienne file ferait disparaître son reliquat.
          python scripts/manage_motor_queue.py advance --queue out/motor-queue-proposed.json --motor-input out/motor-input-resolved.json --output evidence/motor-queue-latest.json
          cp out/run-manifest.json evidence/run-manifest-motor-latest.json
          python scripts/build_run_index.py --output evidence/run-index-latest.json --manifests evidence/run-manifest-latest.json evidence/run-manifest-motor-latest.json
          python scripts/render_control_dashboard.py --input evidence/run-index-latest.json --backlog evidence/motor-backlog-latest.json --out out/control-dashboard.html
      - name: Téléverser la livraison du run
        if: steps.batch.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lawradar-moteur-${{ github.run_id }}
          path: out/
          retention-days: 90
      - name: Versionner le statut du moteur
        if: steps.batch.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "lawradar-motor[bot]"
          git config user.email "lawradar-motor[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add -- evidence/motor-batch-latest.json evidence/motor-queue-latest.json evidence/recycle-backlog-latest.json evidence/run-manifest-motor-latest.json evidence/run-index-latest.json evidence/universal-signal-latest.json evidence/agent-pilot-readiness-latest.json "${{ steps.archive.outputs.archive_path }}" "${{ steps.archive.outputs.durable_manifest_path }}"
          git diff --cached --quiet || git commit -m "Statut moteur LawRadar $(date -u +%F)"
          git pull --rebase origin main
          git push

  record_daily_backlog:
    needs: [moteur, record_skipped]
    if: ${{ always() && !cancelled() && github.event.schedule == '17 19 * * *' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publier l'état de capacité après la dernière fenêtre quotidienne
        run: |
          git pull --ff-only origin main
          python scripts/build_motor_backlog.py --queue evidence/motor-queue-latest.json --output evidence/motor-backlog-latest.json --batch-capacity 250
          python scripts/build_run_index.py --output evidence/run-index-latest.json --manifests evidence/run-manifest-latest.json evidence/run-manifest-motor-latest.json
          mkdir -p out
          python scripts/render_control_dashboard.py --input evidence/run-index-latest.json --backlog evidence/motor-backlog-latest.json --out out/control-dashboard.html
      - name: Versionner l'état de capacité
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "lawradar-motor[bot]"
          git config user.email "lawradar-motor[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add evidence/motor-backlog-latest.json evidence/run-index-latest.json
          git diff --cached --quiet || git commit -m "Capacité moteur LawRadar $(date -u +%F)"
          git pull --rebase origin main
          git push

  client_plan:
    needs: moteur
    if: >-
      ${{
        always() && !cancelled() && (
          github.event.inputs.clients_only == 'true' ||
          (needs.moteur.result == 'success' && needs.moteur.outputs.batch_ready == 'true')
        )
      }}
    runs-on: ubuntu-latest
    outputs:
      client_matrix: ${{ steps.plan.outputs.client_matrix }}
      has_ready: ${{ steps.plan.outputs.has_ready }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Charger le dernier signal universel publié
        run: git pull --ff-only origin main
      - id: plan
        name: Sélectionner uniquement les signaux autorisés par les filtres
        env:
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
        run: |
          mkdir -p out
          python scripts/build_agent_pilot_readiness.py \
            --dossier evidence/universal-signal-latest.json \
            --policy config/compliance-policy-v1.json \
            --profile config/operator-profile-v1.json \
            --output out/agent-pilot-readiness.json
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          readiness = json.loads(Path("out/agent-pilot-readiness.json").read_text(encoding="utf-8"))
          core = json.loads(Path("evidence/universal-signal-latest.json").read_text(encoding="utf-8"))
          evening_schedules = {"17 17 * * *", "17 18 * * *", "17 19 * * *"}
          mode = "consolidated" if os.environ.get("TRIGGER_SCHEDULE") in evening_schedules else "flash"
          already_consolidated = False
          previous_path = Path("evidence/client-orchestration-latest.json")
          if mode == "consolidated" and previous_path.exists():
              try:
                  previous = json.loads(previous_path.read_text(encoding="utf-8"))
                  assembled = datetime.fromisoformat(previous.get("assembled_at_utc", ""))
                  same_day = assembled.astimezone(ZoneInfo("Europe/Paris")).date() == datetime.now(ZoneInfo("Europe/Paris")).date()
                  core_run_id = core.get("run", {}).get("id")
                  same_core = bool(core_run_id) and previous.get("core_run_id") == core_run_id
                  already_consolidated = previous.get("mode") == "consolidated" and same_day and same_core
              except (OSError, ValueError, TypeError):
                  already_consolidated = False
          matrix = []
          for item in [] if already_consolidated else readiness.get("signals", []):
              if item.get("ready_for_pilots") is not True:
                  continue
              signal_id = item["signal_id"]
              key = hashlib.sha256(signal_id.encode("utf-8")).hexdigest()[:16]
              matrix.append({"id": signal_id, "key": key})
          compact = json.dumps(matrix, ensure_ascii=False, separators=(",", ":"))
          Path("out/client-plan.json").write_text(
              json.dumps({"schema": "lawradar-client-plan-v1", "mode": mode, "signals": matrix}, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"client_matrix={compact}\n")
              output.write(f"has_ready={'true' if matrix else 'false'}\n")
              output.write(f"mode={mode}\n")
          print(f"clients_ready={len(matrix)}; mode={mode}; already_consolidated={already_consolidated}")
          PY
      - name: Conserver le noyau immuable pour la convergence des branches
        uses: actions/upload-artifact@v4
        with:
          name: lawradar-client-core-${{ github.run_id }}
          path: |
            evidence/universal-signal-latest.json
            out/agent-pilot-readiness.json
            out/client-plan.json
          retention-days: 90

  # Les deux branches lisent le plan-artéfact et déroulent tous les signaux
  # prêts. Elles sont l'unique chemin client : aucun ancien job Matrix ne
  # peut désormais lancer une seconde collecte ou une seconde qualification.
  press_direct:
    needs: client_plan
    if: ${{ always() && needs.client_plan.result == 'success' && needs.client_plan.outputs.has_ready == 'true' }}
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: lawradar-client-core-${{ github.run_id }}
          path: out/client-core
      - name: Installer le SDK pour les seuls candidats Presse traçables
        run: python -m pip install --disable-pip-version-check "anthropic>=1.0,<2"
      - name: Exécuter Presse sur chaque signal prêt du plan figé
        run: >-
          python scripts/run_client_branch.py --branch press
          --core out/client-core/evidence/universal-signal-latest.json
          --plan out/client-core/out/client-plan.json --output-root out/press
          --model claude-sonnet-5
      - uses: actions/upload-artifact@v4
        with:
          name: lawradar-press-direct-${{ github.run_id }}
          path: out/press/
          retention-days: 90

  demand_market_direct:
    needs: client_plan
    if: ${{ always() && needs.client_plan.result == 'success' && needs.client_plan.outputs.has_ready == 'true' }}
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: lawradar-client-core-${{ github.run_id }}
          path: out/client-core
      - name: Installer le SDK pour les seuls avis BOAMP traçables
        run: python -m pip install --disable-pip-version-check "anthropic>=1.0,<2"
      - name: Exécuter Demande et Marché sur chaque signal prêt du plan figé
        run: >-
          python scripts/run_client_branch.py --branch demand-market
          --core out/client-core/evidence/universal-signal-latest.json
          --plan out/client-core/out/client-plan.json --output-root out/demand-market
          --model claude-sonnet-5
      - uses: actions/upload-artifact@v4
        with:
          name: lawradar-demand-market-boamp-direct-${{ github.run_id }}
          path: out/demand-market/
          retention-days: 90

  consolidate_clients:
    needs: [client_plan, press_direct, demand_market_direct]
    if: ${{ always() && !cancelled() && needs.press_direct.result == 'success' && needs.demand_market_direct.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Télécharger le noyau figé
        uses: actions/download-artifact@v4
        with:
          name: lawradar-client-core-${{ github.run_id }}
          path: out/client-core
      - name: Télécharger les branches Presse, Demande et Marché
        uses: actions/download-artifact@v4
        with:
          pattern: lawradar-press-*
          path: out/client-artifacts
      - uses: actions/download-artifact@v4
        with:
          pattern: lawradar-demand-market-boamp-*
          path: out/client-artifacts
      - name: Assembler un contexte client sans réécrire le noyau
        run: >-
          python scripts/consolidate_client_artifacts.py
          --core out/client-core/evidence/universal-signal-latest.json
          --readiness out/client-core/out/agent-pilot-readiness.json
          --artifacts out/client-artifacts
          --output out/client-context.json
          --mode "${{ needs.client_plan.outputs.mode }}"
      - name: Versionner un marqueur compact séparé du noyau
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          context = json.loads(Path("out/client-context.json").read_text(encoding="utf-8"))
          marker = {
              "schema": "lawradar-client-orchestration-v1",
              "core_run_id": context.get("run", {}).get("id"),
              "mode": context["client_context"]["mode"],
              "assembled_at_utc": context["client_context"]["assembled_at_utc"],
              "status": "SUPPORT_CLIENTS_CONSOLIDATED",
          }
          Path("evidence/client-orchestration-latest.json").write_text(
              json.dumps(marker, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          PY
          git config user.name "lawradar-clients[bot]"
          git config user.email "lawradar-clients[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add evidence/client-orchestration-latest.json
          git diff --cached --quiet || git commit -m "Contexte clients LawRadar $(date -u +%F)"
          git pull --rebase origin main
          git push
      - name: Publier le contexte convergé
        uses: actions/upload-artifact@v4
        with:
          name: lawradar-client-context-${{ github.run_id }}
          path: out/client-context.json
          retention-days: 90

  entrepreneur_direct:
    needs: [client_plan, consolidate_clients]
    if: ${{ always() && needs.consolidate_clients.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: lawradar-client-context-${{ github.run_id }}
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: lawradar-client-core-${{ github.run_id }}
          path: out/client-core
      - name: Installer le SDK pour les seules décisions réellement ouvertes
        if: env.ANTHROPIC_API_KEY != ''
        run: python -m pip install --disable-pip-version-check "anthropic>=1.0,<2"
      - name: Produire chaque note Entrepreneur autorisée par le plan figé
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          plan = json.loads(Path("out/client-core/out/client-plan.json").read_text(encoding="utf-8"))
          for signal in plan.get("signals", []):
              subprocess.run([
                  "python", "scripts/clients/entrepreneur_agent.py",
                  "--input", "out/client-context.json", "--signal-id", signal["id"],
                  "--output", f"out/client-entrepreneur-delivery-{signal['key']}.json",
                  "--run-claude",
              ], check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lawradar-entrepreneur-direct-${{ github.run_id }}
          path: out/client-entrepreneur-delivery-*.json
          if-no-files-found: warn
          retention-days: 90
